name: Simple Go Build
run-name: ${{ github.actor }} is testing Go project 🚀

on: [push, pull_request]

jobs:
  # Ваш демо
  demo:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v4
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      - run: echo "🍏 This job's status is ${{ job.status }}."

  # Простая Go сборка
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Show Go version
        run: go version

      - name: Download dependencies
        run: go mod download || echo "No go.mod found, creating..."

      - name: Initialize module if needed
        run: |
          if [ ! -f go.mod ]; then
            go mod init github.com/${{ github.repository }}
          fi

      - name: Create main.go if not exists
        run: |
          if [ ! -f main.go ]; then
            echo 'package main

          import "fmt"

          func main() {
              fmt.Println("Hello from GitHub Actions!")
          }' > main.go
          fi

      - name: Build application
        run: go build -v ./...

      - name: Run application
        run: |
          if [ -f ./main ]; then
            ./main
          elif [ -f ./*.go ]; then
            go run .
          else
            echo "No executable found to run"
          fi